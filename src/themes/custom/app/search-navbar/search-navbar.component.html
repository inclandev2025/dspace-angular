<form role="search" [attr.aria-label]="'nav.search' | translate" [formGroup]="searchForm"
  (ngSubmit)="onSubmit(searchForm.value)" class="uagrm-header-search">
  <input #searchInput formControlName="query" name="query" type="search"
    [attr.aria-label]="'nav.search' | translate" [placeholder]="'nav.search' | translate"
    class="form-control" [attr.data-test]="'header-search-box' | dsBrowserOnly">
  <button class="submit-icon btn" type="submit" [attr.aria-label]="'nav.search.button' | translate"
    [attr.data-test]="'header-search-icon' | dsBrowserOnly">
    <span class="fas fa-search fa-lg fa-fw" aria-hidden="true"></span>
  </button>
</form>
